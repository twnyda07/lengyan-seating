<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>2026楞嚴法會出席座位統整</title>
<style>/* 2026楞嚴法會出席座位統整 — 共用樣式
   調性：紙墨底，重色只當細節點綴，不用飽和大色塊。
   手機優先：點擊目標 ≥44px、搜尋列 sticky、一屏要看得到夠多筆。 */
:root{
  --紙:#faf8f4; --紙深:#f1ece3; --墨:#2b2622; --墨淡:#6b625a; --線:#ddd5c8;
  --棗:#7a2e2e;            /* 品牌棗紅：只用在字、線、小標，不做大面積底 */
  --金:#9a7b3f;
  --警:#a8521f;            /* 待排／需注意 */
  --安:#4a6b4a;            /* 已排定 */
  --卡:#fffdfa;
  --圓:10px;
  --字:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--紙);color:var(--墨);font-family:var(--字);
  font-size:17px;line-height:1.7;letter-spacing:.01em}

/* ── 版面 ── */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 72px}
header.top{background:var(--紙深);border-bottom:1px solid var(--線);padding:12px 0 8px}
/* .wrap 的 72px 底部留白是給內容區的，套進頁首會在分頁列下方憑空多出一大塊空白 */
header.top .wrap{padding-bottom:0}
header.top h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.02em}
header.top .sub{color:var(--墨淡);font-size:13px;margin-top:3px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px 0 2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;min-height:44px;display:flex;align-items:center;padding:0 16px;
  border:1px solid var(--線);border-radius:999px;background:var(--卡);color:var(--墨淡);
  text-decoration:none;font-size:15px;white-space:nowrap}
nav.tabs a.on{background:var(--墨);color:var(--紙);border-color:var(--墨)}

/* ── 搜尋列（sticky） ── */
.bar{position:sticky;top:0;z-index:30;background:var(--紙);
  border-bottom:1px solid var(--線);padding:10px 0;margin-bottom:12px}
.bar input[type=search],.bar select{min-height:46px;font-size:17px;font-family:var(--字);
  border:1px solid var(--線);border-radius:var(--圓);background:var(--卡);color:var(--墨);padding:0 12px}
.bar input[type=search]{width:100%;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 14px;font-size:15px;
  border:1px solid var(--線);border-radius:999px;background:var(--卡);color:var(--墨淡);cursor:pointer;user-select:none}
.chip.on{background:var(--墨);color:var(--紙);border-color:var(--墨)}
.count{color:var(--墨淡);font-size:14px;padding:6px 2px}

/* ── 統計磚 ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--卡);border:1px solid var(--線);border-radius:var(--圓);padding:12px 14px}
.tile b{display:block;font-size:28px;font-weight:700;line-height:1.2}
.tile span{font-size:13px;color:var(--墨淡)}
.tile.warn b{color:var(--警)} .tile.ok b{color:var(--安)}

/* ── 名單卡 ── */
.list{display:grid;gap:10px}
.row{background:var(--卡);border:1px solid var(--線);border-left:3px solid var(--線);
  border-radius:var(--圓);padding:12px 14px}
.row.待排{border-left-color:var(--警)}
.row.已排{border-left-color:var(--安)}
.row .nm{font-size:19px;font-weight:700}
.row .meta{color:var(--墨淡);font-size:14px;margin-top:2px}
.row .meta b{color:var(--墨);font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;
  border:1px solid var(--線);color:var(--墨淡);margin-right:5px;background:var(--紙深)}
.tag.棗{color:var(--棗);border-color:#e0c9c9}
.tag.警{color:var(--警);border-color:#e8cdbb}
.tag.安{color:var(--安);border-color:#c9d6c9}
.days{display:inline-flex;gap:4px;margin-top:4px}
.d{min-width:34px;text-align:center;font-size:13px;padding:2px 6px;border-radius:6px;
  border:1px solid var(--線);background:var(--紙深);color:var(--墨淡)}
.d.出席{background:#eef2ee;color:var(--安);border-color:#c9d6c9;font-weight:600}
.d.不出席{opacity:.45}
.d.未定{color:var(--警);border-color:#e8cdbb}

/* ── 表格（宗務長過目用，列印友善） ── */
table.t{width:100%;border-collapse:collapse;background:var(--卡);font-size:15px}
table.t th,table.t td{border:1px solid var(--線);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--紙深);font-weight:600;white-space:nowrap}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--線);border-radius:var(--圓)}
.scrollx table.t{border:0}

/* ── 按鈕 ── */
.btn{min-height:46px;display:inline-flex;align-items:center;gap:6px;padding:0 18px;
  border:1px solid var(--墨);border-radius:var(--圓);background:var(--墨);color:var(--紙);
  font-size:16px;font-family:var(--字);cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--卡);color:var(--墨)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}

/* ── 登入 ── */
.gate{max-width:380px;margin:16vh auto;padding:24px;background:var(--卡);
  border:1px solid var(--線);border-radius:var(--圓);text-align:center}
.gate h2{margin:0 0 6px;font-size:19px}
.gate p{color:var(--墨淡);font-size:14px;margin:0 0 16px}
.gate input{width:100%;min-height:48px;font-size:18px;text-align:center;letter-spacing:.1em;
  border:1px solid var(--線);border-radius:var(--圓);background:var(--紙);color:var(--墨);margin-bottom:10px}
.gate .err{color:var(--警);font-size:14px;min-height:20px}

.note{background:var(--紙深);border:1px solid var(--線);border-left:3px solid var(--金);
  border-radius:var(--圓);padding:10px 14px;font-size:14px;color:var(--墨淡);margin:12px 0}
.hide{display:none!important}

/* 有新資料時的橫幅。不自動換頁——門口可能正在打字或正要按報到。 */
#新版橫幅{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap;padding:10px 14px;background:var(--墨);color:var(--紙);font-size:15px}
#新版橫幅 .btn{min-height:40px;padding:0 14px;font-size:15px;
  background:var(--紙);color:var(--墨);border-color:var(--紙)}
#新版橫幅 .btn.ghost{background:transparent;color:var(--紙);border-color:var(--紙)}

/* 訪客身分：看到的內容與工作人員完全相同，但所有會改資料的控制項都收起來。
   這是「看不到按鈕」那一層；真正擋寫入的是後端的訪客密碼不給寫。 */
body.唯讀 .僅限工作人員{display:none!important}
body.唯讀 .唯讀提示{display:block}
.唯讀提示{display:none;background:var(--紙深);border:1px solid var(--線);
  border-left:3px solid var(--金);border-radius:var(--圓);
  padding:8px 12px;font-size:14px;color:var(--墨淡);margin:10px 0}

/* ── 列印 ── */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12pt}
  header.top,nav.tabs,.bar,.btns,.noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  /* ── 長名單要印得出來、而且看得清楚 ──────────────────────────
     以前寫 `table.t{break-inside:avoid}`＝「整張表不要跨頁」。
     **實測（274 列餵進 headless Chrome 印成 PDF）沒有掉列** ——
     一張表塞不進一頁時 Chrome 會直接忽略這條規則照常斷頁。
     所以這裡不是在修「印不出來」，是在修「印出來很難讀」：
       · 10pt 的中文在 A4 上對年長執事太吃力 → 11pt、行距放寬
       · 表頭只重印在 11/12 頁（有一頁剛好卡在整表避頁的邊界）→ 明寫 table-header-group，12 頁都有
       · 274 列從 12 頁縮成 10 頁，而且字還變大了
     語意上也該改：不跨頁的對象本來就是「一列」，不是「整張表」。 */
  .row,.tile{break-inside:avoid;box-shadow:none}
  table.t{break-inside:auto;box-shadow:none}
  table.t tr{break-inside:avoid;page-break-inside:avoid}
  /* 每一頁都要重印一次表頭，否則第二頁開始沒人知道哪一欄是什麼 */
  table.t thead{display:table-header-group}
  table.t tfoot{display:table-footer-group}
  /* 標題不可以落在頁尾（下面的表跑到次頁，標題孤零零留在上一頁） */
  h2,h3{break-after:avoid;page-break-after:avoid}
  .scrollx{overflow:visible;border:0}
  /* 11pt＋寬一點的行距：10pt 的中文在 A4 上對年長執事太吃力 */
  table.t{font-size:11pt;line-height:1.45;width:100%}
  table.t th,table.t td{padding:4pt 5pt}
  /* 長欄位（座位表原文、備註）允許折行，不要把整張表撐爆版面 */
  table.t td{word-break:break-word}
  table.t th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    white-space:nowrap}
  /* 斑馬列：一行一行跟著看不會跳行。列印灰階一定要夠淡才不會蓋住字 */
  table.t tbody tr:nth-child(even){background:#f4f2ee!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* 統計磚在紙上只是參考，縮小讓位給名單 */
  .tiles{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:8px 0}
  .tile{padding:5pt 7pt}
  .tile b{font-size:15pt}
  .tile span{font-size:9pt}
  a[href]:after{content:''}
  .印標題{display:block!important;font-size:15pt;font-weight:700;margin-bottom:8px}
  /* ── 金額一個字都不上紙（主理人裁示）──
     原表的「功德項目」夾帶金額（「妙湛50」），「建寺委員」整欄寫成「5A」。
     螢幕上要看得到原字（執事得核對），紙上一律換成不帶數字的說法。
     這兩個 class 一定要放在**共用**樣式裡：以前只掛在「接待名單」那支模組，
     分日名單與與會者小卡沒掛，於是同樣的字在那兩頁照原樣印上紙。
     放這裡之後，任何一頁用這兩個 class 都會生效，不必每支模組各自記得。 */
  .僅螢幕{display:none!important}
  .僅列印{display:inline-block!important}
}
.印標題{display:none}
.僅列印{display:none}
@media(max-width:560px){
  body{font-size:16px}
  header.top h1{font-size:18px}
  .tile b{font-size:24px}
}
</style>

<script>// AES-256-GCM + PBKDF2(SHA-256) 金鑰包封。
// decryptBlob 回傳 Promise<{明文, 角色, 可寫}>；密碼不對時 reject。
function b64位元組(s){
  var raw = atob(s), u = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) u[i] = raw.charCodeAt(i);
  return u;
}
function 解封(金鑰原料, iv, ct){
  return window.crypto.subtle.importKey('raw', 金鑰原料, 'AES-GCM', false, ['decrypt'])
    .then(function(k){
      return window.crypto.subtle.decrypt({ name:'AES-GCM', iv: b64位元組(iv) }, k, b64位元組(ct));
    });
}
function decryptBlob(blob, 密碼){
  if (!(window.crypto && window.crypto.subtle)) {
    return Promise.reject(new Error('這個瀏覽器不支援解密'));
  }
  var 包;
  try { 包 = JSON.parse(new TextDecoder('utf-8').decode(b64位元組(blob))); }
  catch(e){ return Promise.reject(new Error('資料格式不對')); }

  return window.crypto.subtle.importKey(
      'raw', new TextEncoder().encode(密碼), 'PBKDF2', false, ['deriveBits'])
    .then(function(km){
      // 每個角色的鹽都不同，所以要逐一試。試中哪一把，就知道進來的是誰。
      var 鏈 = Promise.reject(new Error('init'));
      包.k.forEach(function(項){
        鏈 = 鏈.catch(function(){
          return window.crypto.subtle.deriveBits(
              { name:'PBKDF2', salt: b64位元組(項.s), iterations: 包.it, hash:'SHA-256' }, km, 256)
            .then(function(kek){ return 解封(kek, 項.iv, 項.ct); })
            .then(function(dk){ return { 資料金鑰: dk, 角色: 項.r, 可寫: !!項.w, 份: 項.p || 0 }; });
        });
      });
      return 鏈;
    })
    .then(function(結果){
      var 份 = 包.d[結果.份];
      // 內嵌的直接解；外部的（工作人員那份 1.4MB）這時才去抓 ——
      // 信眾解開的是內嵌的精簡版，永遠不會碰到這個 fetch。
      var 拿份 = 份 && 份.外部
        ? fetch(份.外部, { cache: 'no-cache' }).then(function(r){
            if(!r.ok) throw new Error('取不到資料檔（' + r.status + '）');
            return r.json().catch(function(){ throw new Error('資料檔讀不完整，可能是下載被中斷'); });
          }, function(){
            // 網路整個連不上時 fetch 是直接 reject，錯誤訊息是瀏覽器給的
            // 「Failed to fetch」—— 不轉成自己的訊息的話，下面會把它歸到「密碼不對」，
            // 門口的執事就會在網路不穩時一直重打密碼，怎麼打都進不去。
            throw new Error('取不到資料檔（連不上伺服器）');
          }).then(function(f){
            // index.html 與 d0.b64 不是原子發佈，兩邊可能來自不同次建置。
            // 資料金鑰每次都重新隨機，配錯版 AES-GCM 一定驗證失敗 ——
            // 要在這裡先認出來，否則下一步的 reject 會被講成「密碼不對」。
            if (份.v && f.v && 份.v !== f.v) {
              throw new Error('資料檔版本不符（頁面 ' + 份.v + '，資料檔 ' + f.v + '）');
            }
            return f;
          })
        : Promise.resolve(份);
      return 拿份.then(function(f){
        return 解封(結果.資料金鑰, f.iv, f.ct).then(function(buf){
          return {
            明文: new TextDecoder('utf-8').decode(buf),
            角色: 結果.角色,
            可寫: 結果.可寫
          };
        });
      });
    })
    .catch(function(e){
      // 密碼不對與「抓不到外部資料檔」是兩回事，不可以都說成密碼不對 ——
      // 工作人員在現場網路不good時會一直以為自己打錯密碼。
      if (e && /資料檔/.test(e.message || '')) throw e;
      throw new Error('密碼不對');
    });
}</script>

     CSV 只有一張表、沒有欄寬、中文還常常在 Excel 裡變亂碼（要靠 BOM 救），

     省掉實作 deflate；Excel、Numbers、Google 試算表都吃得下。
     字串一律用 inlineStr，不另外做 sharedStrings 表。

  function build(){
    var tabs=document.getElementById('tabs'), view=document.getElementById('view');
    tabs.innerHTML='';   // 重建前先清空，才不會疊出重複的分頁
    var names=Object.keys(window.檢視||{});
    if(!names.length){ view.innerHTML='<div class="note">沒有載入任何檢視模組。</div>'; return; }
    function show(n){
      [].forEach.call(tabs.children,function(a){a.classList.toggle('on',a.dataset.n===n);});
      view.innerHTML='';
      try{ window.檢視[n].render(view); }
      catch(e){ view.innerHTML='<div class="note">「'+n+'」顯示失敗：'+e.message+'</div>'; }
      try{ location.hash=encodeURIComponent(n); }catch(e){}
      window.scrollTo(0,0);
    }
    names.forEach(function(n){
      var a=document.createElement('a');
      a.href='javascript:void 0'; a.dataset.n=n;
      a.textContent=window.檢視[n].標題||n;
      a.onclick=function(){show(n);};
      tabs.appendChild(a);
    });
    var want=decodeURIComponent((location.hash||'').slice(1));
    show(names.indexOf(want)>=0?want:names[0]);
  }

      if(/版本不符/.test(訊)){

      if(/資料檔/.test(訊)){

  (function(){
    var 橫=document.getElementById('新版橫幅'), 狀=document.getElementById('離線狀態');
    function 說(t){ if(狀) 狀.textContent='　'+t; }
    var 有SW = ('serviceWorker' in navigator) && location.protocol!=='file:';

       離線快取是為了「門口斷網也要能報到」而存在的，那是工作人員的需求。
       信眾不需要離線：他們只是查一次自己的座位，查不到可以問服務台。

       給了反而有害 —— 座位到最後一刻都還在調整，
       信眾手機上存著幾天前的舊座位，當天就會拿著它跟門口的執事爭論，

         工作人員 → 裝（可寫＝true 的才是真的要在門口做事的人）
         訪客／大眾 → 不裝，而且把**之前已經裝在這支手機上的清掉**
       清掉這件事很重要：這個開關加上去之前，每個開過這一頁的信眾手機上
       都已經有一份快取了，不主動移除的話它會一直留著。 */
    function 啟用離線(){
      if(!有SW){ 說('（這個瀏覽器不支援離線備用，但資料仍會即時更新）'); return; }
      var 區=document.getElementById('離線說明');
      if(區) 區.classList.remove('hide');

        說('✓ 已可離線使用');
      }).catch(function(e){ 說('（離線備用註冊失敗：'+e.message+'）'); });
    }
    function 停用離線(){
      var 區=document.getElementById('離線說明');
      if(區) 區.classList.add('hide');
      if(!有SW) return;
      /* 註銷 Service Worker 並清掉它存的東西。
         失敗不要吵 —— 使用者什麼都不用做，也幫不上忙。

         要刪好幾次：unregister() 之後，舊的 Service Worker 在這一次載入裡

         真的有漏網的也不要緊：SW 已經註銷，下次載入沒有人會去讀那份快取，
         而且大眾每次登入都會再跑一次這裡，那時沒有 SW 作梗就刪得乾淨。 */
      function 清快取(){
        if(!window.caches) return Promise.resolve();

        }).catch(function(){});

    /* ── 防呆：頁面自己發現拿到舊資料就自己修好 ──
       不能要求使用者去「清除網站資料」或開無痕 —— 法師與執事用手機，不會做這些。
       所以頁面載入後主動跟伺服器對一次時間戳：
       對不上就把快取與舊的 Service Worker 整個清掉再重載一次，使用者什麼都不用做。

    var 本版=null;

    function 轉時間(s){

      return fetch('version.json?live=1&t='+Date.now(),{cache:'no-store'})

             正在打字或正要按報到時畫面突然重載，比看到稍舊的資料更糟。

          if(橫){

              ? '⚠ 這一份可能不是最新（本機 ' + 我的 + '，伺服器 ' + j.資料時間 + '）'
              : '有新的資料（伺服器 ' + j.資料時間 + '）';

       折衷：每 45 秒問一次版本。
         正在做事（在門口報到那頁／游標在輸入框／搜尋框有字／剛操作過）→ 只跳橫幅
         只是在看（總覽、空位、待排、分日、警示、小卡，且 15 秒沒動作）→ 直接換新的 */
    var 最後操作 = Date.now();
    ['click','input','keydown','touchstart'].forEach(function(e){
      document.addEventListener(e, function(){ 最後操作 = Date.now(); }, true);
    });
    function 可以直接換(){
      var 目前 = document.querySelector('#tabs a.on');
      if(目前 && 目前.textContent.indexOf('門口報到') >= 0) return false;   // 門口那頁絕不自動換
      // 只算「看得到的」輸入框。登入用的密碼欄藏起來之後還握著游標，
      // 不排除掉的話會被當成「使用者正在打字」而永遠不自動更新。
      var a = document.activeElement;
      if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.offsetParent !== null) return false;
      var 有字 = false;
      [].forEach.call(document.querySelectorAll('#view input'), function(i){
        if(String(i.value||'').trim()) 有字 = true;                         // 搜尋框有字＝正在查某個人
      });
      if(有字) return false;
      if(Date.now() - 最後操作 < 15000) return false;                        // 剛剛還在操作
      return true;
    }
    function 換上新的(){
      location.replace(location.pathname+'?v='+Date.now()+location.hash);
    }
    function 檢查一次(){
      if(document.hidden) return;                 // 分頁沒在看就不要打伺服器
      return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();})
        .then(function(j){
          if(本版===null){ 本版=j.版本; return; }
          if(j.版本===本版) return;
          if(可以直接換()){ 說('資料有更新，正在換上新的…'); 換上新的(); }
          else if(橫){
            橫.querySelector('span').textContent='有新的資料（伺服器 '+j.資料時間+'）';
            橫.classList.remove('hide');
          }
        }).catch(function(){});
    }
    var 追新計時 = null;
    window.__開始追新 = function(){
      if(追新計時) return;
      追新計時 = setInterval(檢查一次, 45000);
      /* 手機上分頁常常被切到背景。切回來時要馬上對一次，
         不然會看著舊數字等最多 45 秒。 */
      document.addEventListener('visibilitychange', function(){
        if(!document.hidden) setTimeout(檢查一次, 300);
      });
      window.addEventListener('focus', function(){ setTimeout(檢查一次, 300); });
    };
    window.__檢查一次 = 檢查一次;

    var 換=document.getElementById('換新版'), 晚=document.getElementById('稍後');
    if(換) 換.onclick=function(){ location.reload(); };
    if(晚) 晚.onclick=function(){ 橫.classList.add('hide'); };
  })();

  var go=document.getElementById('go');
  go.onclick=tryPw;
  pw.addEventListener('keydown',function(e){ if(e.key==='Enter') tryPw(); });
  // 同一分頁內切換頁面不用重打密碼；關掉分頁就失效
  try{ var s=sessionStorage.getItem('ly26k'); if(s){ pw.value=s; tryPw(); } }catch(e){}
  if(gate.classList.contains('hide')===false) pw.focus();
})();
</script>
</body>
</html>
